<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pulse Nursing Coaching - Live Exam Portal</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts for Bengali & English -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Hind Siliguri', 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
        /* Pulsing Dot Effect */
        .live-dot {
            width: 8px;
            height: 8px;
            background-color: #ef4444;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 0 rgba(239, 68, 68, 0.4);
            animation: pulse-animation 1.5s infinite;
        }
        @keyframes pulse-animation {
            0% {
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7);
            }
            70% {
                box-shadow: 0 0 0 8px rgba(239, 68, 68, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0);
            }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- Main Card Container -->
    <div class="w-full max-w-md bg-white rounded-3xl shadow-xl overflow-hidden border-t-4 border-emerald-500 relative">
        
        <div class="p-6 md:p-8">
            <!-- Logo Section -->
            <div class="flex justify-center mb-6">
                <a href="#" target="_blank" rel="noopener noreferrer">
                    <img 
                        src="https://i.ibb.co.com/Ld7snkkP/logo.png" 
                        alt="Pulse Nursing Coaching Logo" 
                        class="h-16 md:h-20 object-contain"
                        onerror="this.onerror=null; this.src='https://placehold.co/200x80/ffffff/ef4444?text=Pulse+Nursing';"
                    />
                </a>
            </div>

            <!-- Live Exam Badge -->
            <div class="mb-5">
                <span class="inline-flex items-center gap-2 bg-emerald-50 border border-emerald-300 text-emerald-800 text-sm md:text-base font-semibold px-4 py-1.5 rounded-full">
                    <span class="live-dot"></span>
                    আজকের পরীক্ষা (LIVE EXAM)
                </span>
            </div>

            <!-- Date & Subject Title -->
            <div class="mb-6 space-y-1">
                <h1 class="text-xl md:text-2xl font-extrabold text-slate-800 tracking-tight">
                    14 SEPT 2026 <span class="text-slate-400">|</span> সোমবার
                </h1>
                <p class="text-slate-600 font-semibold text-base md:text-lg">
                    SCIENCE <span class="text-slate-400">|</span> ডাইজেস্ট পদার্থবিজ্ঞান অধ্যায়-১
                </p>
            </div>

            <!-- Action Buttons Stack -->
            <div class="space-y-4">
                <!-- BSC Exam Button -->
                <a 
                    href="https://forms.gle/TSqoP9HmKz1fmPYH8" 
                    target="_blank" 
                    rel="noopener noreferrer"
                    class="block w-full text-center py-4 px-6 rounded-2xl bg-sky-50 border-2 border-sky-200 text-sky-700 font-bold text-base md:text-lg tracking-wide shadow-sm hover:bg-sky-100 active:scale-[0.98] transition-all duration-150"
                >
                    BSC EXAM (PHYSICS)
                </a>

                <!-- Diploma Exam Button -->
                <a 
                    href="https://forms.gle/Yfg18WxHM5ADoG9u5" 
                    target="_blank" 
                    rel="noopener noreferrer"
                    class="block w-full text-center py-4 px-6 rounded-2xl bg-amber-50 border-2 border-amber-200 text-amber-800 font-bold text-base md:text-lg tracking-wide shadow-sm hover:bg-amber-100 active:scale-[0.98] transition-all duration-150"
                >
                    DIPLOMA EXAM (PHYSICS)
                </a>
            </div>
            
        </div>
    </div>

</body>
</html>
