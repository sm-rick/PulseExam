<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>বাংলা পারিভাষিক শব্দ কুইজ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Hind Siliguri', sans-serif;
        }
        /* Custom animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-50 via-purple-50 to-pink-50 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-2xl bg-white shadow-2xl rounded-3xl overflow-hidden border border-purple-100">
        
        <!-- Header -->
        <div class="bg-gradient-to-r from-indigo-600 to-purple-600 p-6 text-white text-center relative overflow-hidden">
            <div class="absolute -right-10 -top-10 w-32 h-32 bg-white/10 rounded-full blur-xl"></div>
            <h1 class="text-2xl md:text-3xl font-bold tracking-wide">বাংলা ব্যাকরণ কুইজ</h1>
            <p class="text-indigo-100 text-sm md:text-base mt-1">পারিভাষিক শব্দ (২৫ নম্বর)</p>
        </div>

        <!-- 1. Registration Screen -->
        <div id="reg-screen" class="p-6 md:p-8 animate-fade-in">
            <div class="mb-6 text-center">
                <span class="bg-indigo-100 text-indigo-700 text-xs font-semibold px-3 py-1 rounded-full uppercase tracking-wider">অংশগ্রহণকারী তথ্য</span>
                <h2 class="text-xl font-bold text-gray-800 mt-2">কুইজে অংশগ্রহণ করতে আপনার তথ্য দিন</h2>
            </div>
            
            <form id="user-form" class="space-y-5">
                <div>
                    <label class="block text-gray-700 font-medium mb-2" for="user-name">আপনার পূর্ণ নাম</label>
                    <input type="text" id="user-name" required placeholder="যেমন: রাশেদুল ইসলাম" 
                        class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:outline-none transition">
                </div>
                
                <div>
                    <label class="block text-gray-700 font-medium mb-2" for="user-course">আপনার কোর্স নির্বাচন করুন</label>
                    <select id="user-course" required 
                        class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:outline-none transition bg-white">
                        <option value="" disabled selected>-- কোর্স সিলেক্ট করুন --</option>
                        <option value="বিএসসি (BSc)">বিএসসি (BSc)</option>
                        <option value="ডিপ্লোমা (Diploma)">ডিপ্লোমা (Diploma)</option>
                    </select>
                </div>

                <div id="form-error" class="text-red-500 text-sm hidden text-center font-medium"></div>

                <button type="submit" 
                    class="w-full py-3 bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-bold rounded-xl shadow-lg hover:from-indigo-700 hover:to-purple-700 transition transform active:scale-95">
                    কুইজ শুরু করুন
                </button>
            </form>
        </div>

        <!-- 2. Quiz Screen -->
        <div id="quiz-screen" class="p-6 md:p-8 hidden animate-fade-in">
            <!-- Progress & Info bar -->
            <div class="flex justify-between items-center mb-6 text-sm text-gray-600 border-b pb-3">
                <div>প্রশ্ন: <span id="current-q-num" class="font-bold text-indigo-600">1</span> / <span id="total-q-num">25</span></div>
                <div class="bg-indigo-50 text-indigo-700 px-3 py-1 rounded-full font-semibold" id="display-user-info"></div>
            </div>

            <!-- Question Box -->
            <div class="mb-6">
                <h3 id="question-text" class="text-lg md:text-xl font-bold text-gray-800 leading-snug"></h3>
            </div>

            <!-- Options Container -->
            <div id="options-container" class="space-y-3 mb-6">
                <!-- Dynamic options generated via JS -->
            </div>

            <!-- Next Button -->
            <div class="flex justify-end">
                <button id="next-btn" disabled 
                    class="px-6 py-2.5 bg-gray-300 text-gray-500 font-semibold rounded-xl cursor-not-allowed transition">
                    পরবর্তী প্রশ্ন
                </button>
            </div>
        </div>

        <!-- 3. Result Screen -->
        <div id="result-screen" class="p-6 md:p-8 text-center hidden animate-fade-in">
            <div class="w-20 h-20 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl shadow-inner">
                🎉
            </div>
            <h2 class="text-2xl font-bold text-gray-800 mb-1">কুইজ সম্পন্ন হয়েছে!</h2>
            <p class="text-gray-500 mb-6">আপনার পারফরম্যান্স রিপোর্ট নিচে দেওয়া হলো</p>

            <div class="bg-gray-50 border border-gray-200 rounded-2xl p-6 mb-6 text-left space-y-3 shadow-sm">
                <div class="flex justify-between border-b pb-2">
                    <span class="text-gray-600 font-medium">নাম:</span>
                    <span id="res-name" class="font-bold text-gray-800"></span>
                </div>
                <div class="flex justify-between border-b pb-2">
                    <span class="text-gray-600 font-medium">কোর্স:</span>
                    <span id="res-course" class="font-bold text-gray-800"></span>
                </div>
                <div class="flex justify-between border-b pb-2">
                    <span class="text-gray-600 font-medium">সঠিক উত্তর:</span>
                    <span id="res-correct" class="font-bold text-green-600"></span>
                </div>
                <div class="flex justify-between">
                    <span class="text-gray-600 font-medium">প্রাপ্ত নম্বর:</span>
                    <span id="res-score" class="font-bold text-indigo-600 text-lg"></span>
                </div>
            </div>

            <div id="feedback-message" class="text-sm font-medium p-3 rounded-xl mb-6"></div>

            <button onclick="location.reload()" 
                class="px-8 py-3 bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-bold rounded-xl shadow-lg hover:from-indigo-700 hover:to-purple-700 transition">
                পুনরায় কুইজ দিন
            </button>
        </div>

    </div>

    <script>
        // Quiz Data: 25 Paribhasik Shabda Questions
        const questions = [
            {
                question: "'Academy' এর সঠিক পারিভাষিক শব্দ কোনটি?",
                options: ["বিশ্ববিদ্যালয়", "অ্যাকাডেমি", "একাডেমি (সংসদ)", "বিদ্যায়তন"],
                answer: 3
            },
            {
                question: "'Bibliography' এর পারিভাষিক রূপ কী?",
                options: ["জীবনী", "গ্রন্থপঞ্জি", "গ্রন্থমালা", "সাহিত্যতালিকা"],
                answer: 1
            },
            {
                question: "'Cabinet' শব্দের বাংলা পরিভাষা—",
                options: ["মন্ত্রিসভা", "বাক্স", "সচিবালয়", "ক্যাবিনেট"],
                answer: 0
            },
            {
                question: "'Copyright' শব্দের সঠিক পরিভাষা কোনটি?",
                options: ["নকল অধিকার", "গ্রন্থস্বত্ব", "ছাপার অধিকার", "প্রকাশনা স্বত্ব"],
                answer: 1
            },
            {
                question: "'Diplomacy' এর বাংলা পরিভাষা কী?",
                options: ["কুটনীতি", "রাষ্ট্রনীতি", "সচিবালয়", "বৈদেশিক সম্পর্ক"],
                answer: 0
            },
            {
                question: "'Embargo' শব্দের পারিভাষিক শব্দ—",
                options: ["নিষেধাজ্ঞা", "বাণিজ্য অবরোধ", "শুল্ক", "জরুরি অবস্থা"],
                answer: 0
            },
            {
                question: "'Gazette' এর বাংলা পরিভাষা কোনটি?",
                options: ["খবরের কাগজ", "বিজ্ঞপ্তি", "গেজেট", "সরকারি প্রজ্ঞাপন"],
                answer: 3
            },
            {
                question: "'Honorarium' শব্দের সঠিক পরিভাষা কী?",
                options: ["সম্মাননা", "সম্মানী", "বেতন", "পুরস্কার"],
                answer: 1
            },
            {
                question: "'Manifesto' এর বাংলা পরিভাষা কোনটি?",
                options: ["ঘোষণা", "ইশতেহার", "প্রতিশ্রুতি", "দলিল"],
                answer: 1
            },
            {
                question: "'Neutrality' শব্দের পরিভাষা কী?",
                options: ["নিরপেক্ষতা", "শান্তিবাদ", "স্থিরতা", "সক্রিয়তা"],
                answer: 0
            },
            {
                question: "'Ordinance' এর বাংলা পরিভাষা—",
                options: ["আইন", "অধ্যাদেশ", "বিধিমালা", "আদেশ"],
                answer: 1
            },
            {
                question: "'Plagiarism' শব্দের সঠিক পরিভাষা কোনটি?",
                options: ["সাহিত্য চুরি", "বক্তব্য নকল", "অবিকল অনুকরণ", "মেধাস্বত্ব হরণ"],
                answer: 0
            },
            {
                question: "'Quorum' শব্দের বাংলা পরিভাষা কী?",
                options: ["সংখ্যাগরিষ্ঠতা", "কোরম (গণপূর্তি)", "সদস্য সংখ্যা", "সভা"],
                answer: 1
            },
            {
                question: "'Ratification' এর পারিভাষিক শব্দ কোনটি?",
                options: ["অনুমোদন", "বাস্তবায়ন", "স্বাক্ষর", "সমর্থন"],
                answer: 0
            },
            {
                question: "'Subjudice' শব্দের পরিভাষা—",
                options: ["বিচারাধীন", "আইনগত", "সংশ্লিষ্টা", "বিচারাধীন বিষয়"],
                answer: 0
            },
            {
                question: "'Tribute' শব্দের বাংলা পরিভাষা কী?",
                options: ["কর", "শ্রদ্ধাঞ্জলি", "উপহার", "স্বীকৃতি"],
                answer: 1
            },
            {
                question: "'Veto' শব্দের সঠিক পরিভাষা কোনটি?",
                options: ["নিষেধাতিরিক্ত ক্ষমতা", "নিষেধাজ্ঞা", "ভেটো (অমর্যাদা)", "বাতিল ক্ষমতা"],
                answer: 1
            },
            {
                question: "'Warranty' শব্দের পারিভাষিক রূপ—",
                options: ["গ্যারান্টি", "দায়বদ্ধতা", "ওয়ারেন্টি (প্রত্যয়পত্র)", "মেয়াদ"],
                answer: 2
            },
            {
                question: "'Yield' এর বাংলা পরিভাষা কী?",
                options: ["ফলন বা উৎপাদন", "লাভ", "আত্মসমর্পণ", "পরিমাণ"],
                answer: 0
            },
            {
                question: "'Agenda' শব্দের পরিভাষা কোনটি?",
                options: ["কার্যতালিকা", "সভা", "বিবরণী", "পরিকল্পনা"],
                answer: 0
            },
            {
                question: "'Budget' শব্দের বাংলা পরিভাষা কী?",
                options: ["অর্থায়ন", "বাজেট", "প্রাক্কলন", "আয়-ব্যয়"],
                answer: 2
            },
            {
                question: "'Default' শব্দের সঠিক পরিভাষা কোনটি?",
                options: ["ত্রুটি", "খেলাপি", "অক্ষমতা", "বিকল্প"],
                answer: 1
            },
            {
                question: "'Epidemic' এর পারিভাষিক শব্দ কী?",
                options: ["মহামারি", "সংক্রামক রোগ", "ব্যাধি", "দুর্যোগ"],
                answer: 0
            },
            {
                question: "'Fraction' শব্দের পরিভাষা কোনটি?",
                options: ["ভগ্নাংশ", "খণ্ড", "অংশ", "অনুপাত"],
                answer: 0
            },
            {
                question: "'Glossary' এর বাংলা পরিভাষা কী?",
                options: ["শব্দার্থ", "শব্দার্থকোষ বা পরিভাষা", "অভিধান", "টীকা"],
                answer: 1
            }
        ];

        let currentUser = { name: "", course: "" };
        let currentQuestionIndex = 0;
        let score = 0;
        let selectedOptionIndex = null;
        let isAnswered = false;

        // DOM Elements
        const regScreen = document.getElementById('reg-screen');
        const quizScreen = document.getElementById('quiz-screen');
        const resultScreen = document.getElementById('result-screen');
        const userForm = document.getElementById('user-form');
        const formError = document.getElementById('form-error');
        const currentQNum = document.getElementById('current-q-num');
        const totalQNum = document.getElementById('total-q-num');
        const displayUserInfo = document.getElementById('display-user-info');
        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const nextBtn = document.getElementById('next-btn');

        totalQNum.innerText = questions.length;

        userForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const nameInput = document.getElementById('user-name').value.trim();
            const courseInput = document.getElementById('user-course').value;

            if (!nameInput || !courseInput) {
                formError.innerText = "দয়া করে নাম এবং কোর্স উভয়ই সিলেক্ট করুন।";
                formError.classList.remove('hidden');
                return;
            }

            currentUser.name = nameInput;
            currentUser.course = courseInput;

            regScreen.classList.add('hidden');
            quizScreen.classList.remove('hidden');
            displayUserInfo.innerText = `${currentUser.name} (${currentUser.course})`;

            loadQuestion();
        });

        function loadQuestion() {
            isAnswered = false;
            selectedOptionIndex = null;
            nextBtn.disabled = true;
            nextBtn.className = "px-6 py-2.5 bg-gray-300 text-gray-500 font-semibold rounded-xl cursor-not-allowed transition";
            nextBtn.innerText = currentQuestionIndex === questions.length - 1 ? "ফলাফল দেখুন" : "পরবর্তী প্রশ্ন";

            currentQNum.innerText = currentQuestionIndex + 1;
            const q = questions[currentQuestionIndex];
            questionText.innerText = q.question;

            optionsContainer.innerHTML = "";
            q.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left px-5 py-3.5 rounded-xl border border-gray-200 hover:bg-indigo-50 hover:border-indigo-300 font-medium text-gray-700 transition flex items-center justify-between";
                btn.innerHTML = `<span>${opt}</span> <span class="w-6 h-6 rounded-full border border-gray-300 flex items-center justify-center text-xs text-gray-400">${String.fromCharCode(65 + index)}</span>`;
                btn.onclick = () => selectOption(index, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function selectOption(index, selectedElement) {
            if (isAnswered) return;
            isAnswered = true;

            const q = questions[currentQuestionIndex];
            const optionButtons = optionsContainer.children;

            if (index === q.answer) {
                score++;
                selectedElement.className = "w-full text-left px-5 py-3.5 rounded-xl border border-green-500 bg-green-50 text-green-800 font-medium transition flex items-center justify-between shadow-sm";
                selectedElement.querySelector('span:last-child').className = "w-6 h-6 rounded-full bg-green-500 text-white flex items-center justify-center text-xs font-bold";
                selectedElement.querySelector('span:last-child').innerText = "✓";
            } else {
                selectedElement.className = "w-full text-left px-5 py-3.5 rounded-xl border border-red-500 bg-red-50 text-red-800 font-medium transition flex items-center justify-between shadow-sm";
                selectedElement.querySelector('span:last-child').className = "w-6 h-6 rounded-full bg-red-500 text-white flex items-center justify-center text-xs font-bold";
                selectedElement.querySelector('span:last-child').innerText = "✕";

                // Highlight correct option
                const correctBtn = optionButtons[q.answer];
                correctBtn.className = "w-full text-left px-5 py-3.5 rounded-xl border border-green-500 bg-green-50 text-green-800 font-medium transition flex items-center justify-between shadow-sm";
                correctBtn.querySelector('span:last-child').className = "w-6 h-6 rounded-full bg-green-500 text-white flex items-center justify-center text-xs font-bold";
                correctBtn.querySelector('span:last-child').innerText = "✓";
            }

            // Enable next button
            nextBtn.disabled = false;
            nextBtn.className = "px-6 py-2.5 bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-semibold rounded-xl shadow-md hover:from-indigo-700 hover:to-purple-700 transition transform active:scale-95 cursor-pointer";
        }

        nextBtn.onclick = () => {
            if (!isAnswered) return;
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                loadQuestion();
            } else {
                showResults();
            }
        };

        function showResults() {
            quizScreen.classList.add('hidden');
            resultScreen.classList.remove('hidden');

            document.getElementById('res-name').innerText = currentUser.name;
            document.getElementById('res-course').innerText = currentUser.course;
            document.getElementById('res-correct').innerText = `${score} টি সঠিক`;
            document.getElementById('res-score').innerText = `${score} / 25`;

            const feedbackMsg = document.getElementById('feedback-message');
            const percentage = (score / 25) * 100;

            if (percentage >= 80) {
                feedbackMsg.className = "text-green-700 bg-green-50 border border-green-200 text-sm font-medium p-3 rounded-xl mb-6 text-center";
                feedbackMsg.innerText = "অভিনন্দন! আপনার প্রস্তুতি চমৎকার হয়েছে।";
            } else if (percentage >= 50) {
                feedbackMsg.className = "text-yellow-700 bg-yellow-50 border border-yellow-200 text-sm font-medium p-3 rounded-xl mb-6 text-center";
                feedbackMsg.innerText = "ভালো ফলাফল! আরেকটু অনুশীলন করলে আরও ভালো করতে পারবেন।";
            } else {
                feedbackMsg.className = "text-red-700 bg-red-50 border border-red-200 text-sm font-medium p-3 rounded-xl mb-6 text-center";
                feedbackMsg.innerText = "উন্নতির অনেক সুযোগ রয়েছে। বাংলা ব্যাকরণ আরও অধ্যয়ন করুন।";
            }
        }
    </script>
</body>
</html>
